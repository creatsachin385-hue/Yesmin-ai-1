name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Unpack ZIP & Prepare Project Structure
        run: |
          echo "=== Step 1: Listing repository files ==="
          ls -la

          # Extract ZIP if present
          shopt -s nullglob
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done

          # Relocate nested android folder if inside a subfolder
          if [ ! -d "android" ]; then
            NESTED_ANDROID=$(find . -maxdepth 4 -type d -name "android" | head -n 1)
            if [ -n "$NESTED_ANDROID" ]; then
              PARENT_DIR=$(dirname "$NESTED_ANDROID")
              echo "Relocating files from $PARENT_DIR to current directory..."
              cp -rn "$PARENT_DIR"/* . || true
            fi
          fi

          echo "=== Step 2: Verifying android directory ==="
          if [ -d "android" ]; then
            ls -la android
          else
            echo "Warning: android directory not found!"
          fi

      - name: Install Node Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || true
          fi

      - name: Build Web Application
        run: |
          if [ -f "package.json" ]; then
            npm run build || npx vite build || true
          fi

      - name: Copy Web Dist to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          if [ -d "dist" ]; then
            cp -r dist/* android/app/src/main/assets/dist/ || true
          fi

      - name: Setup Android SDK Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-GalaxyTab-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
